packages:
  - 'napi/*'
  - 'packages/*'
  - 'tasks/*'
  - 'wasm/*'
  - apps/*

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  wasm-pack: true
  workerd: true

catalog:
  '@types/node': ^25.9.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5

minimumReleaseAgeExclude:
  - '@kazupon/vp-config'
  - 'wasm-pack'
  - vize
  - '@vizejs/**'

overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
