name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
  pull_request:
    branches:
      - '**'
    paths:
      - .github/workflows/**
  workflow_dispatch: # eslint-disable-line yml/no-empty-mapping-value -- NOTE(kazupon): allow manual re-runs

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to GitHub Code Scanning.
      security-events: write
      # Required for `actions/checkout` to clone the repository so zizmor
      # can read `.github/workflows/`.
      contents: read
      # Required by `zizmor-action` to query workflow run metadata via the
      # GitHub Actions REST API.
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
