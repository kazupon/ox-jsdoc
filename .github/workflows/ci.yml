---
name: CI

env:
  CI: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    name: Lint (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked --force

      - name: Building
        run: vpr build

      - name: Check strictly codes
        run: vpr check

  test:
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        # The packages support Node.js 26 too (engines: ^22.22.2 || >=24.15.0)
        include:
          - os: ubuntu-latest
            node: 26
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked --force

      - name: Install playwright
        run: vp exec playwright install chromium

      - name: Building
        run: vpr build

      - name: Testing
        run: vpr test

      - name: Comparing ESLint and Oxlint diagnostics of the jsdoc plugin
        run: vp run @ox-jsdoc/benchmark#jsdoc-linter:parity
